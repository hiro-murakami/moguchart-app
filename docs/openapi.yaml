openapi: 3.1.0
info:
  title: Moguchart REST API
  version: 1.0.0
  description: |
    Moguchartの外部アプリ向けREST API。
    ガントチャートプロジェクトの管理（プロジェクト・行・タスク・コメント・スナップショット）を提供します。

    ## 認証
    すべてのエンドポイント（ヘルスチェックを除く）は `X-API-Key` ヘッダーによるAPIキー認証が必要です。
    APIキーには `read`（読み取り専用）と `read-write`（読み書き）の2つのスコープがあります。
    書き込み操作には `read-write` スコープが必要です。

    ## レスポンス形式
    すべてのレスポンスは以下の統一形式で返されます:
    ```json
    {
      "status": "succeeded" | "failed",
      "message": "（任意）",
      "data": ...
    }
    ```
  contact:
    name: Moguchart
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://api-{projectId}.cloudfunctions.net/api
    description: Firebase Cloud Functions (本番)
    variables:
      projectId:
        default: moguchart
        description: Firebase プロジェクトID

tags:
  - name: Health
    description: ヘルスチェック
  - name: Public
    description: 公開プロジェクト（認証不要）
  - name: Projects
    description: プロジェクトの管理
  - name: Rows
    description: ガントチャートの行（グループ）管理
  - name: Tasks
    description: ガントチャートのタスク管理
  - name: Comments
    description: コメント管理（プロジェクト・行・タスク共通）
  - name: Task Comments
    description: タスクに紐づくコメント管理
  - name: Snapshots
    description: プロジェクトのスナップショット管理
  - name: User
    description: ユーザー情報
  - name: API Keys
    description: APIキーの管理

paths:
  # ──────────────────────────────────────────────
  # Health
  # ──────────────────────────────────────────────
  /api/v1/health:
    get:
      operationId: getHealth
      summary: ヘルスチェック
      description: APIの稼働状態を確認します。認証不要です。
      tags: [Health]
      security: []
      responses:
        '400':
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: 正常稼働
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: '1.0.0'

  # ──────────────────────────────────────────────
  # Public Projects（認証不要）
  # ──────────────────────────────────────────────
  /api/v1/public/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: getPublicProject
      summary: 公開プロジェクト情報取得
      description: 一般公開されているプロジェクトのメタ情報を取得します。認証は不要です。
      tags: [Public]
      security: []
      responses:
        '200':
          description: 公開プロジェクト情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_Project'
        '403':
          description: プロジェクトが一般公開されていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/public/projects/{projectId}/gantt:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: getPublicProjectGantt
      summary: 公開プロジェクトのガントチャートデータ取得
      description: 一般公開されているプロジェクトのガントチャートデータ（行・タスク）を取得します。認証は不要です。
      tags: [Public]
      security: []
      responses:
        '200':
          description: ガントチャートデータ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_GanttRowList'
        '403':
          description: プロジェクトが一般公開されていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ──────────────────────────────────────────────
  # Projects
  # ──────────────────────────────────────────────
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: プロジェクト一覧取得
      description: 認証ユーザーがアクセス可能なプロジェクトの一覧を返します。
      tags: [Projects]
      responses:
        '200':
          description: プロジェクト一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_ProjectList'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      operationId: createProject
      summary: プロジェクト作成
      description: 新しいプロジェクトを作成します。`read-write` スコープが必要です。
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: 作成成功（プロジェクトIDを返す）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_String'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/projects/restore:
    post:
      operationId: restoreProjectRoot
      summary: プロジェクト復元（インポート）
      description: |
        JSONまたはZIPデータからプロジェクトを復元（インポート）します。`read-write` スコープが必要です。
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/GanttDataJson'
                - type: object
                  properties:
                    zipBase64:
                      type: string
                      description: ZIP圧縮されたデータのBase64文字列
                  required: [zipBase64]
      responses:
        '200':
          description: 復元成功（プロジェクトIDを返す）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_String'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: getProject
      summary: プロジェクト単体取得
      description: 指定したプロジェクトのメタ情報を取得します。
      tags: [Projects]
      responses:
        '200':
          description: プロジェクト情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      operationId: updateProject
      summary: プロジェクト更新
      description: 指定したプロジェクトを更新します。`read-write` スコープが必要です。
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_String'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: deleteProject
      summary: プロジェクト削除
      description: 指定したプロジェクトを削除します。`read-write` スコープが必要です。
      tags: [Projects]
      responses:
        '200':
          description: 削除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_Void'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/projects/{projectId}/duplicate:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    post:
      operationId: duplicateProject
      summary: プロジェクト複製
      description: |
        指定したプロジェクトを複製します。`read-write` スコープが必要です。
        `newStartDate` を指定すると、元の開始日との差分で全タスク・マイルストーンの日付がスライドされます。
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newProjectData:
                  $ref: '#/components/schemas/ProjectInput'
                  description: 新しいプロジェクトのデータ
                newStartDate:
                  type: string
                  format: date
                  description: 新しい開始日（YYYY-MM-DD）。指定時、日付をスライドします。
                  example: '2026-07-01'
                clearProgress:
                  type: boolean
                  description: trueの場合、全タスクの進捗率をクリアします。
                  default: false
      responses:
        '201':
          description: 複製成功（新しいプロジェクトIDを返す）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_String'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/projects/{projectId}/chart:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: getProjectChart
      summary: ガントチャートデータ取得
      description: 指定プロジェクトのガントチャートデータ（行・タスク含む）を返します。
      tags: [Projects]
      responses:
        '200':
          description: ガントチャートデータ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_GanttRowList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/projects/{projectId}/rows:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: getProjectRows
      summary: 行データ取得
      description: 指定プロジェクトの行データを取得します。`rowIds` クエリパラメータで絞り込み可能です。
      tags: [Projects]
      parameters:
        - name: rowIds
          in: query
          description: 取得する行IDのカンマ区切りリスト
          required: false
          schema:
            type: string
            example: '1,2,3'
      responses:
        '200':
          description: 行データ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_GanttRowList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/projects/{projectId}/json:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: getProjectJson
      summary: JSON形式でフルデータ取得
      description: プロジェクトのフルデータをJSON形式で返します。エクスポートやバックアップに利用できます。
      tags: [Projects]
      responses:
        '200':
          description: フルデータ（JSON）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_GanttDataJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/projects/{projectId}/zip:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: getProjectZip
      summary: ZIP形式でダウンロード
      description: プロジェクトデータをZIP圧縮してBase64エンコードした文字列を返します。
      tags: [Projects]
      responses:
        '200':
          description: ZIP（Base64エンコード）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_String'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/projects/{projectId}/restore:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    post:
      operationId: restoreProject
      summary: プロジェクト復元
      description: |
        JSONまたはZIPデータからプロジェクトを復元します。`read-write` スコープが必要です。
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/GanttDataJson'
                - type: object
                  properties:
                    zipBase64:
                      type: string
                      description: ZIP圧縮されたデータのBase64文字列
                  required: [zipBase64]
      responses:
        '200':
          description: 復元成功（プロジェクトIDを返す）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_String'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ──────────────────────────────────────────────
  # Rows
  # ──────────────────────────────────────────────
  /api/v1/rows:
    post:
      operationId: createRow
      summary: 行の作成
      description: ガントチャートの行を作成します。`read-write` スコープが必要です。
      tags: [Rows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GanttRowInput'
      responses:
        '201':
          description: 作成成功（行IDを返す）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_NumberOrArray'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    put:
      operationId: updateRow
      summary: 行の更新
      description: 行を更新します。単体または一括更新が可能です。`read-write` スコープが必要です。
      tags: [Rows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/GanttRowInput'
                - type: array
                  items:
                    $ref: '#/components/schemas/GanttRowInput'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_NumberOrArray'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      operationId: deleteRows
      summary: 行の削除
      description: 指定した行IDの行を一括削除します。`read-write` スコープが必要です。
      tags: [Rows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                  description: 削除する行IDの配列
                  example: [1, 2, 3]
      responses:
        '200':
          description: 削除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_Void'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/rows/{rowId}:
    parameters:
      - $ref: '#/components/parameters/RowId'

    put:
      operationId: updateRowById
      summary: 行の単体更新
      description: 指定した行を更新します。`read-write` スコープが必要です。
      tags: [Rows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GanttRowInput'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_NumberOrArray'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      operationId: deleteRowById
      summary: 行の単体削除
      description: 指定した行IDの行を削除します。`read-write` スコープが必要です。
      tags: [Rows]
      responses:
        '200':
          description: 削除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_Void'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/rows/order:
    put:
      operationId: updateRowOrder
      summary: 行の並び順更新
      description: 行の表示順序を更新します。`read-write` スコープが必要です。
      tags: [Rows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/GanttRowOrder'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_Void'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ──────────────────────────────────────────────
  # Tasks
  # ──────────────────────────────────────────────
  /api/v1/tasks:
    post:
      operationId: createTasks
      summary: タスクの作成/更新
      description: タスクを作成または更新します。配列で複数タスクの一括処理が可能です。`read-write` スコープが必要です。
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    tasks:
                      type: array
                      items:
                        $ref: '#/components/schemas/GanttTaskInput'
                  required: [tasks]
                - type: array
                  items:
                    $ref: '#/components/schemas/GanttTaskInput'
                - $ref: '#/components/schemas/GanttTaskInput'
      responses:
        '201':
          description: 作成/更新成功（タスクID配列を返す）
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [succeeded]
                  data:
                    type: array
                    items:
                      type: integer
                    description: 作成/更新されたタスクID
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    put:
      operationId: updateTasks
      summary: タスクの一括/単体更新
      description: タスクを更新します。配列で複数タスクの一括処理が可能です。`read-write` スコープが必要です。
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    tasks:
                      type: array
                      items:
                        $ref: '#/components/schemas/GanttTaskInput'
                  required: [tasks]
                - type: array
                  items:
                    $ref: '#/components/schemas/GanttTaskInput'
                - $ref: '#/components/schemas/GanttTaskInput'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [succeeded]
                  data:
                    type: array
                    items:
                      type: integer
                    description: 更新されたタスクID
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      operationId: deleteTasks
      summary: タスクの一括削除
      description: 指定したタスクIDのタスクを一括削除します。`read-write` スコープが必要です。
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                  description: 削除するタスクIDの配列
                  example: [10, 20]
      responses:
        '200':
          description: 削除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_Void'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'

    put:
      operationId: updateTaskById
      summary: タスクの単体更新
      description: 指定したタスクを更新します。`read-write` スコープが必要です。
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GanttTaskInput'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [succeeded]
                  data:
                    type: array
                    items:
                      type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      operationId: deleteTaskById
      summary: タスクの単体削除
      description: 指定したタスクを削除します。`read-write` スコープが必要です。
      tags: [Tasks]
      responses:
        '200':
          description: 削除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_Void'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/tasks/{taskId}/comments:
    parameters:
      - $ref: '#/components/parameters/TaskId'

    get:
      operationId: getTaskCommentsDirect
      summary: タスクコメント一覧取得
      description: 指定タスクに紐づくコメント一覧を取得します。
      tags: [Task Comments]
      responses:
        '200':
          description: タスクコメント一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_CommentList'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      operationId: createTaskCommentDirect
      summary: タスクコメント作成/更新
      description: タスクに紐づくコメントを作成または更新します。`read-write` スコープが必要です。
      tags: [Task Comments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentInput'
      responses:
        '201':
          description: 作成成功（コメントIDを返す）
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [succeeded]
                  data:
                    type: integer
