packages:
  - packages/*

allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  protobufjs: true

overrides:
  '@grpc/grpc-js@<1.13.6': '>=1.13.6 <2.0.0'
  'zod@<4.6.6': '>=4.6.6'
  'uuid@<11.1.1': '>=11.1.1'
  'glob@>=9.0.0 <=14.0.1': '>=14.0.2'
  'minimatch@>=7.0.0 <11.0.1': '>=11.0.1'
  'fast-xml-parser@<=5.11.2': '>=5.12.0'

